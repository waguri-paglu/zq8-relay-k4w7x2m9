name: Gofile Live Upload Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct file URL to download & upload to Gofile'
        required: true
        default: 'https://ash-speed.hetzner.com/10GB.bin'

jobs:
  test-gofile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Runner Disk & Gofile Gate
        run: |
          df -h /
          echo "--- api.gofile.io/servers ---"
          curl -sS -w "\nHTTP:%{http_code}\n" --max-time 15 https://api.gofile.io/servers | head -c 800
          echo ""

      - name: Install aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

      - name: Probe & Download File
        run: |
          URL="${{ github.event.inputs.url }}"
          echo "Testing URL: $URL"
          curl -fsSL -r 0-0 -D - -o /dev/null --max-time 15 "$URL"
          mkdir -p /tmp/gf_test
          aria2c -x 8 -s 8 -k 1M --continue=true --max-tries=5 --retry-wait=3 --summary-interval=15 -d /tmp/gf_test "$URL"
          ls -lh /tmp/gf_test
          df -h /

      - name: Upload File to Gofile
        run: |
          FILE_PATH=$(find /tmp/gf_test -type f | head -n 1)
          FILE_SIZE=$(stat -c%s "$FILE_PATH")
          echo "Uploading: $FILE_PATH ($FILE_SIZE bytes)"
          RESP_FILE=/tmp/gofile_resp.json
          STATS=$(curl -sS -o "$RESP_FILE" -w "HTTP=%{http_code} TIME=%{time_total}s SPEED=%{speed_upload}B/s" \
            --connect-timeout 20 --max-time 3500 \
            -F "file=@${FILE_PATH}" \
            "https://upload.gofile.io/uploadfile")
          echo "$STATS"
          cat "$RESP_FILE"
          echo ""
          DL_PAGE=$(jq -r '.data.downloadPage // empty' "$RESP_FILE" 2>/dev/null || true)
          echo "DOWNLOAD_PAGE=$DL_PAGE"
          test -n "$DL_PAGE"
