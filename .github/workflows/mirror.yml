name: Cloud Mirror Engine

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Task Job ID'
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Runner Scripts
        uses: actions/checkout@v4

      - name: Install Transfer & Archive Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 rclone p7zip-full unzip tar curl jq

      - name: Execute Mirror Job
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          WORKER_URL: https://telegram-gdrive-bot.yashdaive.workers.dev
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          YTDL_COOKIES: ${{ secrets.YTDL_COOKIES }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 runner/mirror_runner.py
