name: Kurigram Smoke Check

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check default disk space, ffmpeg, kurigram MTProto
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          df -h /
          python3 - << 'PY'
          import asyncio, os, shutil, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "runner")
          import mirror_runner as mr

          free_gb = shutil.disk_usage("/").free / (1024 ** 3)
          print(f"DEFAULT_FREE_GB={free_gb:.2f}")
          assert free_gb > 15.0, f"Unexpected low free space: {free_gb:.2f} GB"

          mr.ensure_kurigram_tools()
          from pyrogram import Client
          from pyrogram.enums import ParseMode
          print("KURIGRAM_IMPORT_OK", ParseMode.HTML)

          with tempfile.TemporaryDirectory() as td:
              td_p = Path(td)
              mp4 = td_p / "sample.mp4"
              subprocess.run(
                  ["ffmpeg", "-y", "-f", "lavfi", "-i", "testsrc=size=320x240:rate=15",
                   "-f", "lavfi", "-i", "sine=frequency=440", "-t", "2",
                   "-c:v", "libx264", "-c:a", "aac", str(mp4)],
                  check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              )
              meta = mr.probe_media_meta(mp4)
              thumb = mr.make_media_thumb(mp4, td_p)
              print(f"PROBE_META={meta}")
              print(f"THUMB_EXISTS={bool(thumb and thumb.exists())} THUMB_SIZE={thumb.stat().st_size if thumb else 0}")
              assert meta["duration"] >= 1 and meta["width"] == 320 and meta["height"] == 240
              assert thumb and thumb.exists() and thumb.stat().st_size > 0

          async def check_mtproto():
              app = Client(
                  "smoke_bot",
                  api_id=int(os.environ["TELEGRAM_API_ID"]),
                  api_hash=os.environ["TELEGRAM_API_HASH"],
                  bot_token=os.environ["TELEGRAM_BOT_TOKEN"],
                  in_memory=True,
                  no_updates=True,
              )
              async with app:
                  me = await app.get_me()
                  print(f"MTPROTO_BOT_OK username=@{me.username} is_bot={me.is_bot}")

          asyncio.run(check_mtproto())
          PY
