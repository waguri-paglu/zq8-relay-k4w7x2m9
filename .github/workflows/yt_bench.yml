name: YT Speed Benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --break-system-packages -q --upgrade "yt-dlp[default]" mutagen || python3 -m pip install -q --upgrade "yt-dlp[default]" mutagen

      - name: End-to-End Dashy Download and Merge Verification
        env:
          YTDL_COOKIES: ${{ secrets.YTDL_COOKIES }}
        run: |
          python3 - << 'PY'
          import os, json, time, shutil, tempfile
          import yt_dlp

          raw = (os.environ.get("YTDL_COOKIES") or "").strip()
          cookie_file = "/tmp/bench_cookies.txt"
          if raw.startswith("["):
              items = json.loads(raw)
              lines = ["# Netscape HTTP Cookie File"]
              for c in items:
                  dom = (c.get("domain") or "").strip()
                  if not dom:
                      continue
                  inc = "TRUE" if dom.startswith(".") else "FALSE"
                  path = c.get("path") or "/"
                  sec = "TRUE" if c.get("secure") else "FALSE"
                  exp = str(int(c.get("expirationDate") or c.get("expires") or 0))
                  lines.append("\t".join([dom, inc, path, sec, exp, c.get("name") or "", c.get("value") or ""]))
              open(cookie_file, "w").write("\n".join(lines) + "\n")
          else:
              open(cookie_file, "w").write(raw + "\n")

          d = tempfile.mkdtemp(prefix="yte2e_")
          hooks = {"ticks": 0, "max_spd": 0.0, "last_log": 0.0, "streams": []}
          def p_hook(info):
              if info.get("status") == "downloading":
                  hooks["ticks"] += 1
                  spd = float(info.get("speed") or 0)
                  if spd > hooks["max_spd"]:
                      hooks["max_spd"] = spd
                  now = time.time()
                  if now - hooks["last_log"] >= 2.0:
                      hooks["last_log"] = now
                      done = float(info.get("downloaded_bytes") or 0)
                      tot = float(info.get("total_bytes") or info.get("total_bytes_estimate") or 0)
                      print(f"PROGRESS: done={done/1e6:.1f}MB tot={tot/1e6:.1f}MB spd={spd/1e6:.1f}MB/s", flush=True)
              elif info.get("status") == "finished":
                  hooks["streams"].append(info.get("filename"))

          opts = {
              "format": "bv*[height<=720][ext=mp4]+ba[ext=m4a]/bv*[height<=720]+ba/b[height<=720]/b",
              "outtmpl": f"{d}/%(title).150B [%(id)s].%(ext)s",
              "cookiefile": cookie_file,
              "writethumbnail": True,
              "merge_output_format": "mp4",
              "postprocessors": [
                  {"key": "FFmpegMetadata", "add_chapters": True, "add_metadata": True},
                  {"key": "EmbedThumbnail", "already_have_thumbnail": False},
              ],
              "progress_hooks": [p_hook],
              "concurrent_fragment_downloads": 16,
              "http_chunk_size": 10 * 1024 * 1024,
              "buffersize": 1024 * 1024,
              "retries": 10,
              "fragment_retries": 10,
              "file_access_retries": 5,
              "extractor_retries": 5,
              "extractor_args": {"youtube": {"formats": ["dashy"]}},
              "js_runtimes": {"node": {}} if shutil.which("node") else {},
              "quiet": True,
              "no_warnings": True,
              "noprogress": True,
          }

          t0 = time.time()
          with yt_dlp.YoutubeDL(opts) as ydl:
              ydl.extract_info("https://youtu.be/Kdxem4YkrJY", download=True)
          dt = time.time() - t0
          outs = [(fn, os.path.getsize(os.path.join(d, fn))) for fn in os.listdir(d)]
          print(f"E2E RESULT: dt={dt:.1f}s ticks={hooks['ticks']} max_spd={hooks['max_spd']/1e6:.2f}MB/s outs={outs}", flush=True)
          shutil.rmtree(d, ignore_errors=True)
          os.remove(cookie_file)
          PY
